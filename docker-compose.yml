services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD","mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  api:
    build: ./app/api
    restart: unless-stopped
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/linkpulse
      BASE_URL: ${BASE_URL:-http://localhost:8080}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
  

  frontend:
    build: ./app/frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data: